    <title>TravelCraft - Gotta Travel 'Em All</title>
    <script>
      // Apply the persisted theme before first paint so dark mode never flashes light.
      (function () {
        try {
          var stored = localStorage.getItem('project_travelcraft_themeMode');
          var mode = stored === 'dark' || stored === '"dark"' ? 'dark' : 'light';
          if (mode === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.dataset.theme = 'dark';
          }
        } catch (e) { /* private mode - default to light */ }
      })();
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
